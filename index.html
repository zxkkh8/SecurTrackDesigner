<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SecurTrack Image HTML Generator</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f1f5f9;
    margin: 0;
    padding: 40px;
}

.container {
    max-width: 800px;
    margin: auto;
    background: white;
    padding: 25px;
    border-radius: 15px;
    box-shadow: 0 4px 15px rgba(0,0,0,.1);
}

h1 {
    margin-top: 0;
}

input {
    width: 100%;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 8px;
    box-sizing: border-box;
    margin-bottom: 15px;
}

button {
    background: #2563eb;
    color: white;
    border: none;
    padding: 12px 20px;
    border-radius: 8px;
    cursor: pointer;
}

button:hover {
    background: #1d4ed8;
}

textarea {
    width: 100%;
    height: 100px;
    margin-top: 15px;
    padding: 12px;
    border-radius: 8px;
    border: 1px solid #ccc;
    box-sizing: border-box;
    font-family: monospace;
}

.preview {
    margin-top: 20px;
}

.preview img {
    max-width: 100%;
    border: 1px solid #ddd;
    border-radius: 10px;
}
</style>
</head>

<body>

<div class="container">
    <h1>SecurTrack Image HTML Generator</h1>

    <input
        type="text"
        id="imageUrl"
        placeholder="https://your-securtrack-domain.com/image.png">

    <button onclick="generateHtml()">Generate HTML</button>

    <textarea id="output" readonly placeholder="Generated HTML will appear here..."></textarea>

    <div class="preview">
        <h3>Preview</h3>
        <img id="previewImage" style="display:none;">
    </div>
</div>

<script>
function generateHtml() {
    const url = document.getElementById('imageUrl').value.trim();

    const html = `<img src="${url}" alt="SecurTrack Image">`;

    document.getElementById('output').value = html;

    const preview = document.getElementById('previewImage');
    preview.src = url;
    preview.style.display = 'block';
}
</script>

</body>
</html>
